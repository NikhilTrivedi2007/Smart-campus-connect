<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Smart Campus Connect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dash-container { max-width: 1050px; margin: 35px auto; padding: 0 20px; }
        .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .tab-btn { padding: 10px 18px; border: 1px solid #6757e8; background: white; color: #6757e8; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #6757e8; color: white; }
        .tab-panel { display: none; background: white; padding: 25px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .tab-panel.active { display: block; }
        .item-list { margin-top: 25px; display: grid; gap: 14px; }
        .item-card { padding: 16px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8faff; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #eeebff; color: #6757e8; }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">🎓</span>
            <span>Campus<span class="highlight">Connect</span></span>
        </a>
        <div class="nav-buttons">
            <a href="assistant.html" class="login-btn">🤖 AI Assistant</a>
            <span id="userGreeting" style="font-weight:bold; color:#172554;"></span>
            <button id="logoutBtn" class="signup-btn" style="border:none; cursor:pointer;">Logout</button>
        </div>
    </header>

    <main class="dash-container">
        <div class="tabs">
            <button class="tab-btn active" data-tab="complaints">📝 Smart Complaints</button>
            <button class="tab-btn" data-tab="lostfound">🔍 Lost & Found</button>
            <button class="tab-btn" data-tab="events">📅 Campus Events</button>
            <button class="tab-btn" data-tab="notices">📢 Notice Board</button>
        </div>

        <section id="complaints" class="tab-panel active">
            <h3>Submit a Complaint</h3>
            <form id="complaintForm" style="margin-top:15px;">
                <div class="form-group"><input type="text" id="cTitle" placeholder="Complaint Title" required></div>
                <div class="form-group">
                    <select id="cCategory">
                        <option value="Hostel">Hostel</option>
                        <option value="Academics">Academics</option>
                        <option value="IT/WiFi">IT/WiFi</option>
                        <option value="Infrastructure">Infrastructure</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group"><input type="text" id="cDesc" placeholder="Describe the issue..." required></div>
                <button type="submit" class="auth-btn">Submit Complaint</button>
            </form>
            <div id="complaintList" class="item-list"></div>
        </section>

        <section id="lostfound" class="tab-panel">
            <h3>Report Lost / Found Item</h3>
            <form id="lostFoundForm" style="margin-top:15px;">
                <div class="form-group"><input type="text" id="lfName" placeholder="Item Name" required></div>
                <div class="form-group">
                    <select id="lfType">
                        <option value="Lost">Lost</option>
                        <option value="Found">Found</option>
                    </select>
                </div>
                <div class="form-group"><input type="text" id="lfLocation" placeholder="Location (e.g., Library 2nd Floor)" required></div>
                <div class="form-group"><input type="text" id="lfContact" placeholder="Contact Phone / Email" required></div>
                <div class="form-group"><input type="text" id="lfDesc" placeholder="Description" required></div>
                <button type="submit" class="auth-btn">Post Item</button>
            </form>
            <div id="lostFoundList" class="item-list"></div>
        </section>

        <section id="events" class="tab-panel">
            <h3>Campus Events</h3>
            <form id="eventForm" class="admin-only" style="margin-top:15px; display:none;">
                <div class="form-group"><input type="text" id="eTitle" placeholder="Event Title" required></div>
                <div class="form-group"><input type="date" id="eDate" required></div>
                <div class="form-group"><input type="text" id="eVenue" placeholder="Venue" required></div>
                <div class="form-group"><input type="text" id="eDesc" placeholder="Event Description" required></div>
                <button type="submit" class="auth-btn">Create Event</button>
            </form>
            <div id="eventList" class="item-list"></div>
        </section>

        <section id="notices" class="tab-panel">
            <h3>Smart Notice Board</h3>
            <form id="noticeForm" class="admin-only" style="margin-top:15px; display:none;">
                <div class="form-group"><input type="text" id="nTitle" placeholder="Notice Title" required></div>
                <div class="form-group"><input type="text" id="nContent" placeholder="Notice Details" required></div>
                <button type="submit" class="auth-btn">Post Notice</button>
            </form>
            <div id="noticeList" class="item-list"></div>
        </section>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
