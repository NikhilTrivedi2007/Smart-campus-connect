<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Campus Assistant - Smart Campus Connect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-wrapper { max-width: 800px; margin: 35px auto; padding: 0 20px; }
        .chat-box { background: white; border-radius: 16px; box-shadow: 0 12px 30px rgba(103,87,232,0.1); overflow: hidden; display: flex; flex-direction: column; height: 75vh; }
        .chat-header { background: #6757e8; color: white; padding: 18px 24px; font-weight: bold; font-size: 18px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #f8faff; }
        .msg { max-width: 78%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #6757e8; color: white; }
        .msg.bot { align-self: flex-start; background: white; color: #172554; border: 1px solid #e2e8f0; }
        .chat-form { display: flex; gap: 10px; padding: 16px; background: white; border-top: 1px solid #e2e8f0; }
        .chat-form input { flex: 1; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px; }
        .chat-form input:focus { border-color: #6757e8; }
        .chat-form button { background: #6757e8; color: white; border: none; padding: 0 22px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .chat-form button:hover { background: #5141ca; }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">🎓</span>
            <span>Campus<span class="highlight">Connect</span></span>
        </a>
        <div class="nav-buttons">
            <a href="dashboard.html" class="login-btn">Dashboard</a>
            <a href="login.html" class="signup-btn">Login</a>
        </div>
    </header>

    <main class="chat-wrapper">
        <div class="chat-box">
            <div class="chat-header">🤖 AI Campus Assistant</div>
            <div id="chatMessages" class="chat-messages">
                <div class="msg bot">Hi! Ask me about upcoming campus events, recent notices, or general college help.</div>
            </div>
            <form id="chatForm" class="chat-form">
                <input type="text" id="questionInput" placeholder="Ask something about campus..." required>
                <button type="submit">Send</button>
            </form>
        </div>
    </main>

    <script src="js/assistant.js"></script>
</body>
</html>
